name: Сборка

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  linux:
    name: Тесты и проверка компиляции (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Тесты цветового движка
        run: dotnet test tests/Imagine.Color.Tests/Imagine.Color.Tests.csproj -c Release --logger "console;verbosity=normal"
      - name: Тесты ядра
        run: dotnet test tests/Imagine.Core.Tests/Imagine.Core.Tests.csproj -c Release --logger "console;verbosity=normal"
      - name: Компиляция слоя Windows
        run: dotnet build src/Imagine.Platform.Windows/Imagine.Platform.Windows.csproj -c Release
      - name: Компиляция приложения WinUI (без упаковки ресурсов)
        run: >
          dotnet build src/Imagine.App/Imagine.App.csproj -c Release -r win-x64 -p:Platform=x64
          -p:AppxGeneratePriEnabled=false -p:WindowsAppSDKSelfContained=false

  windows:
    name: Сборка для Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Тесты
        run: |
          dotnet test tests/Imagine.Color.Tests/Imagine.Color.Tests.csproj -c Release
          dotnet test tests/Imagine.Core.Tests/Imagine.Core.Tests.csproj -c Release
      - name: Обычная сборка (без установки), x64
        run: dotnet publish src/Imagine.App/Imagine.App.csproj -c Release -r win-x64 -p:Platform=x64 -o out/Imagine-win-x64
      - name: Обычная сборка, ARM64
        continue-on-error: true
        run: dotnet publish src/Imagine.App/Imagine.App.csproj -c Release -r win-arm64 -p:Platform=ARM64 -o out/Imagine-win-arm64
      - name: Архивы
        shell: pwsh
        run: |
          Compress-Archive -Path out/Imagine-win-x64/* -DestinationPath out/Imagine-win-x64.zip
          if (Test-Path out/Imagine-win-arm64) { Compress-Archive -Path out/Imagine-win-arm64/* -DestinationPath out/Imagine-win-arm64.zip }
      - uses: actions/upload-artifact@v4
        with:
          name: Imagine-win-x64
          path: out/Imagine-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: hashFiles('out/Imagine-win-arm64.zip') != ''
        with:
          name: Imagine-win-arm64
          path: out/Imagine-win-arm64.zip

      # MSIX нужен для чтения уведомлений и смены экрана блокировки. Подписываем самоподписанным
      # сертификатом CN=Imagine; его открытая часть (.cer) лежит рядом с пакетом.
      - name: Пакет MSIX
        id: msix
        continue-on-error: true
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Imagine" -KeyUsage DigitalSignature -FriendlyName "Imagine" `
            -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "imagine-ci" -Force -AsPlainText
          New-Item -ItemType Directory -Force out/msix | Out-Null
          Export-PfxCertificate -Cert $cert -FilePath out/imagine.pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath out/msix/Imagine.cer | Out-Null
          dotnet publish src/Imagine.App/Imagine.App.csproj -c Release -r win-x64 -p:Platform=x64 `
            -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=true -p:PackageCertificateKeyFile="$PWD/out/imagine.pfx" -p:PackageCertificatePassword=imagine-ci `
            -p:AppxPackageDir="$PWD/out/msix/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item out/imagine.pfx
          Get-ChildItem out/msix -Recurse | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        if: steps.msix.outcome == 'success'
        with:
          name: Imagine-msix
          path: |
            out/msix/**/*.msix
            out/msix/Imagine.cer

  release:
    name: Релиз по тегу
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f \( -name "*.zip" -o -name "*.msix" -o -name "*.cer" \) -print0 | xargs -0 gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes
